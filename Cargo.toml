[workspace]
members = ["app", "auth", "blog", "utils"]
resolver = "2"

# (optional) put shared deps here so members can inherit:
# [workspace.dependencies]
# anyhow = "1"
# thiserror = "1"


[workspace.dependencies]
axum = "0.8.6"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
uuid   = { version = "1.18.1", features = ["serde", "v4"] }
serde  = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = [
    "runtime-tokio-rustls", "postgres", "macros", "uuid", "chrono", "migrate"
] }
tokio = { version="1.48.0", features = ["rt-multi-thread"] }
http = "1.3.1"
# add (safe to keep versions small & stable)
dotenvy = "0.15.7"
tower = { version = "0.5.1", features = ["limit", "timeout"] }
anyhow = "1.0.89"
